[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omli"
version = "0.1.0"
description = "OMLi (Open Model Local integrator): shared core + config packs"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Travis Williams"}]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# ed25519 head signing. Optional: without it, an existing signature reports `unverifiable`.
sign = ["cryptography>=41"]

[tool.setuptools.packages.find]
include = ["omli*"]

[tool.setuptools.package-data]
"omli.defaults" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
